<!doctype html>
<!-- The page the remote Chrome scrolls in the measurements: a long article, text in three scripts
     and photo-like pictures (a seeded plasma fractal with grain), always the same. -->
<meta charset="utf-8">
<title>article</title>
<style>
  body { margin: 0; background: #fafaf7; color: #222; font: 17px/1.6 "DejaVu Sans", "Noto Sans CJK SC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 40px 2000px; }
  h1 { font-size: 30px; margin: 8px 0 16px; }
  canvas { display: block; width: 100%; height: auto; margin: 18px 0; border-radius: 6px; }
  p { margin: 0 0 14px; }
</style>
<main id="m"><h1>云桌面 · クラウドデスクトップ · Cloud desktop</h1></main>
<script>
  let seed = 20261109
  const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
  const zh = '助手在自己的桌面上用浏览器操作，遇到登录、两步验证、验证码这类步骤会停下来请你接管。你接管期间，助手的桌面和浏览器操作都会被拒绝；你交还后它接着做。'
  const ja = 'アシスタントは自分のデスクトップでブラウザを操作し、ログインや二段階認証の画面では作業を止めて引き継ぎを待ちます。'
  const en = 'The quick brown fox jumps over the lazy dog while the agent waits for a human to finish the sign-in and hand the screen back. '
  function photo(w, h) {
    // diamond-square plasma, mapped through a warm/cool palette, plus film grain
    const n = 513, g = new Float32Array(n * n)
    let step = n - 1, scale = 1
    g[0] = rand(); g[n - 1] = rand(); g[(n - 1) * n] = rand(); g[n * n - 1] = rand()
    while (step > 1) {
      const half = step / 2
      for (let y = half; y < n; y += step) for (let x = half; x < n; x += step) {
        const a = g[(y - half) * n + x - half], b = g[(y - half) * n + x + half], c = g[(y + half) * n + x - half], d = g[(y + half) * n + x + half]
        g[y * n + x] = (a + b + c + d) / 4 + (rand() - 0.5) * scale
      }
      for (let y = 0; y < n; y += half) for (let x = (y / half) % 2 ? 0 : half; x < n; x += step) {
        let s = 0, k = 0
        if (y >= half) { s += g[(y - half) * n + x]; k++ } if (y + half < n) { s += g[(y + half) * n + x]; k++ }
        if (x >= half) { s += g[y * n + x - half]; k++ } if (x + half < n) { s += g[y * n + x + half]; k++ }
        g[y * n + x] = s / k + (rand() - 0.5) * scale
      }
      step = half; scale *= 0.55
    }
    const c = document.createElement('canvas'); c.width = w; c.height = h
    const ctx = c.getContext('2d'), img = ctx.createImageData(w, h)
    const hue = rand() * 6.28
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const v = g[Math.floor(y * (n - 1) / h) * n + Math.floor(x * (n - 1) / w)], i = (y * w + x) * 4
      const grain = (rand() - 0.5) * 8
      img.data[i] = 128 + 110 * Math.sin(v * 5 + hue) + grain
      img.data[i + 1] = 120 + 90 * Math.sin(v * 4 + hue + 2) + grain
      img.data[i + 2] = 110 + 100 * Math.sin(v * 3 + hue + 4) + grain
      img.data[i + 3] = 255
    }
    ctx.putImageData(img, 0, 0)
    return c
  }
  const m = document.getElementById('m')
  for (let i = 0; i < 18; i++) {
    for (let j = 0; j < 3; j++) {
      const p = document.createElement('p')
      p.textContent = [zh, ja, en][(i + j) % 3].repeat(2 + ((i + j) % 3))
      m.append(p)
    }
    if (i % 2 === 0) m.append(photo(780, 420))
  }
  document.title = 'article ready'
</script>
