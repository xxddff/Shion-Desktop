name: Hermes plugin

# Runs the shion Hermes plugin's tests (hermes-plugin/tests). Most need only pytest: Hermes itself is
# replaced by stand-ins of the few interfaces the plugin uses. Skill reviews are also run against
# Hermes itself (the second job): there the plugin reads Hermes's own skill ledger and calls its
# rollback and archive, which a stand-in can only imitate as it was read.
on:
  push:
    paths:
      - 'hermes-plugin/**'
      - '.github/workflows/hermes-plugin.yml'
  pull_request:
    paths:
      - 'hermes-plugin/**'
      - '.github/workflows/hermes-plugin.yml'
  workflow_dispatch:

concurrency:
  group: hermes-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: hermes-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q

  hermes:
    name: skill reviews against Hermes itself
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # NousResearch/hermes-agent as the plugin was last read against (shion/reviews.py, HermesLedger).
      # Move it on when the server's Hermes moves on: a ledger the plugin no longer reads right fails here.
      HERMES_REF: 611bf53e5b31a4ea084594a643fbeae8cb1827de
    defaults:
      run:
        working-directory: hermes-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Hermes
        run: pip install pytest "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@${HERMES_REF}"
      - name: Hermes's skill tool, ledger and archive are there to import
        # the tests skip themselves where Hermes is missing: here that would be a pass that tested nothing
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME"
          python -c "import tools.skill_ledger, tools.skill_manager_tool, tools.skill_usage, agent.skill_utils"
      - name: Skill reviews over the real ledger
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          python -m pytest -q -rs tests/test_reviews_hermes.py
