name: Hermes plugin

# Runs the shion Hermes plugin's tests (hermes-plugin/tests). Most need only pytest: Hermes itself is
# replaced by stand-ins of the few interfaces the plugin uses. Skill reviews are also run against
# Hermes itself (the second job): there the plugin reads Hermes's own skill ledger and calls its
# rollback and archive, which a stand-in can only imitate as it was read.
on:
  push:
    paths:
      - 'hermes-plugin/**'
      - '.github/workflows/hermes-plugin.yml'
  pull_request:
    paths:
      - 'hermes-plugin/**'
      - '.github/workflows/hermes-plugin.yml'
  workflow_dispatch:

concurrency:
  group: hermes-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.14 is what Hermes itself runs on
        python: ['3.11', '3.13', '3.14']
    defaults:
      run:
        working-directory: hermes-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q

  hermes:
    name: skill reviews against Hermes itself
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hermes-plugin
    steps:
      - uses: actions/checkout@v7
      - name: Skill reviews over the real ledger, in a container
        # What you run locally: builds an image with Hermes at the commit the script pins (HERMES_REF)
        # and its dependencies from its own uv.lock, then runs tests/test_reviews_hermes.py in it.
        # A Hermes that cannot be imported there fails the tests (SHION_REQUIRE_HERMES), not skips them.
        run: ./test-with-hermes.sh
      - name: The plugin's other tests beside Hermes, on its Python
        run: ./test-with-hermes.sh python -m pytest -p no:cacheprovider -q -rs
